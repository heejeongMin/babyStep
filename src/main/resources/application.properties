spring.application.name=baby-steps

#===============================================================================
# Database
#===============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/babies?currentSchema=babies
spring.datasource.username=babies
spring.datasource.password=babies
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.autoCommit=false
spring.datasource.hikari.pool-name=${spring.application.name}-db-pool
spring.datasource.hikari.schema=babies

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false

#===============================================================================
# LIQUIBASE
#===============================================================================
spring.liquibase.change-log=classpath:/db/db-changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.user=${spring.datasource.username}
spring.liquibase.password=${spring.datasource.password}
spring.liquibase.url=${spring.datasource.url}

#===============================================================================
# Auth
#===============================================================================
# Override JWT_SECRET in any real deployment (32+ characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
# Comma-separated origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

